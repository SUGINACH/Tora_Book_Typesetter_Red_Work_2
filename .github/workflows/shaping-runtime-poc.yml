name: shaping-runtime-poc

on:
  push:
    branches: [ engine/legacy-parity-preview-20261119 ]
    paths:
      - 'tools/shaping-runtime-poc/**'
      - 'tools/bidi-runtime-poc/**'
      - 'red-build/src/engine/typography/**'
      - 'red-build/tests/unit/shaped-run.test.js'
      - 'red-build/tests/unit/text-item-shaping-plan.test.js'
      - 'red-build/tests/unit/harfbuzz-shaper.test.js'
      - 'red-build/tests/unit/production-typography-runtime.test.js'
      - 'red-build/tests/unit/worker-runtime-init.test.js'
      - 'red-build/tests/unit/s3-font-sync.test.js'
      - '.github/workflows/shaping-runtime-poc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harfbuzz-node-classic-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install browser font fixture
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core python3-venv
      - name: Checkout pinned Unicode 18 Bidi/ICU4X itemizer source
        run: |
          git clone https://github.com/servo/unicode-bidi.git /tmp/unicode-bidi
          git -C /tmp/unicode-bidi checkout 9a8c7b03be01def5cf7014b89d5af90f7382fdad
          test "$(git -C /tmp/unicode-bidi rev-parse HEAD)" = "9a8c7b03be01def5cf7014b89d5af90f7382fdad"
      - name: Regenerate pinned Unicode 18.0.0 Bidi tables
        run: |
          python3 tools/bidi-runtime-poc/prepare_unicode_bidi.py /tmp/unicode-bidi
          cd /tmp/unicode-bidi
          python3 tools/generate.py
          grep -F 'pub const UNICODE_VERSION: (u64, u64, u64) = (18, 0, 0);' src/char_data/tables.rs
          test "$(head -n 1 data/ucd/DerivedBidiClass.txt)" = "# DerivedBidiClass-18.0.0.txt"
      - name: Build pinned Unicode 18 Bidi/grapheme WASM itemizer
        run: |
          mkdir -p /tmp/unicode-bidi/bidi-runtime-poc-wrapper/src
          cp tools/bidi-runtime-poc/wasm/Cargo.toml /tmp/unicode-bidi/bidi-runtime-poc-wrapper/Cargo.toml
          cp tools/bidi-runtime-poc/wasm/src/lib.rs /tmp/unicode-bidi/bidi-runtime-poc-wrapper/src/lib.rs
          cd /tmp/unicode-bidi
          RUSTFLAGS="-C link-arg=--export-memory" cargo build \
            --manifest-path bidi-runtime-poc-wrapper/Cargo.toml \
            --target-dir /tmp/unicode-bidi/target \
            --target wasm32-unknown-unknown --release
          WASM_FILE=/tmp/unicode-bidi/target/wasm32-unknown-unknown/release/red_bidi_runtime_poc.wasm
          test -s "$WASM_FILE"
          echo "BIDI_POC_WASM=$WASM_FILE" >> "$GITHUB_ENV"
      - name: Install fontTools and Brotli for offline WOFF2 normalization
        run: |
          python3 -m venv /tmp/hb-poc-venv
          /tmp/hb-poc-venv/bin/pip install --disable-pip-version-check fonttools==4.68.0 brotli==1.2.1
          echo "HB_POC_PYTHON=/tmp/hb-poc-venv/bin/python" >> "$GITHUB_ENV"
      - name: Install headless browser
        run: |
          npm install -g agent-browser@0.41.2
          agent-browser install --with-deps
      - name: Prove Node and classic Worker shaping parity
        run: node tools/shaping-runtime-poc/run.js
      - name: Verify and commit pinned runtime assets to the working branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/engine/legacy-parity-preview-20261119'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = '/tmp/shaping-runtime-poc-runtime';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.artifactKind !== 'staged-runtime-assets-not-production-enabled') {
            throw new Error('Unexpected runtime artifact kind');
          }
          if (manifest.harfbuzz.package !== 'harfbuzzjs' || manifest.harfbuzz.version !== '1.6.4' ||
              manifest.harfbuzz.license !== 'MIT') {
            throw new Error('Unexpected HarfBuzz package identity/license');
          }
          if (manifest.unicode.version !== '18.0.0' ||
              manifest.unicode.revision !== '9a8c7b03be01def5cf7014b89d5af90f7382fdad') {
            throw new Error('Unexpected Unicode runtime identity');
          }
          const seen = new Set();
          for (const file of manifest.files) {
            if (seen.has(file.path)) throw new Error('Duplicate manifest path: ' + file.path);
            seen.add(file.path);
            const bytes = fs.readFileSync(path.join(root, file.path));
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            if (bytes.length !== file.bytes || hash !== file.sha256) {
              throw new Error('Runtime asset hash/size mismatch: ' + file.path);
            }
          }
          const required = [
            'harfbuzzjs/dist/index.mjs',
            'harfbuzzjs/dist/harfbuzz.js',
            'harfbuzzjs/dist/harfbuzz.wasm',
            'harfbuzzjs/package.json',
            'harfbuzzjs/LICENSE',
            'unicode18-bidi-runtime.js',
            'unicode18-bidi-runtime.wasm'
          ];
          for (const name of required) {
            if (!seen.has(name)) throw new Error('Required runtime asset absent from manifest: ' + name);
          }
          if (!fs.existsSync(path.join(root, 'README.md'))) throw new Error('Runtime README missing');
          if (!fs.existsSync(path.join(root, 'manifest.json'))) throw new Error('Runtime manifest missing');
          NODE
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin engine/legacy-parity-preview-20261119
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Working branch moved during runtime proof; refusing to publish assets."
            exit 1
          fi
          target="red-build/ui/assets/shaping-runtime"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a /tmp/shaping-runtime-poc-runtime/. "$target/"
          cmp -s red-build/src/engine/typography/unicode18-bidi-runtime.js "$target/unicode18-bidi-runtime.js"
          git add -f "$target"
          if git diff --cached --quiet; then
            echo "Pinned runtime assets are already identical in the working branch."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(typography): vendor pinned shaping runtime assets"
          git push origin "HEAD:refs/heads/engine/legacy-parity-preview-20261119"
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaping-runtime-poc
          path: /tmp/shaping-runtime-poc-report.json
          if-no-files-found: ignore

      - name: Upload hash-locked runtime assets (staging only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaping-runtime-assets
          path: /tmp/shaping-runtime-poc-runtime/
          if-no-files-found: ignore

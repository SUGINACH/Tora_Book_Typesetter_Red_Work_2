name: bidi-runtime-poc

on:
  push:
    branches: [ engine/legacy-parity-preview-20261119 ]
    paths:
      - 'tools/bidi-runtime-poc/**'
      - '.github/workflows/bidi-runtime-poc.yml'
  workflow_dispatch:

concurrency:
  group: bidi-runtime-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unicode18-utf16-bidi:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Checkout pinned unicode-bidi source
        run: |
          git clone https://github.com/servo/unicode-bidi.git /tmp/unicode-bidi
          git -C /tmp/unicode-bidi checkout 9a8c7b03be01def5cf7014b89d5af90f7382fdad
          git -C /tmp/unicode-bidi rev-parse HEAD
      - name: Regenerate Bidi tables from versioned Unicode 18.0.0 UCD
        run: |
          python3 tools/bidi-runtime-poc/prepare_unicode_bidi.py /tmp/unicode-bidi
          cd /tmp/unicode-bidi
          python3 tools/generate.py
          grep -F 'pub const UNICODE_VERSION: (u64, u64, u64) = (18, 0, 0);' src/char_data/tables.rs
          test "$(head -n 1 data/ucd/DerivedBidiClass.txt)" = "# DerivedBidiClass-18.0.0.txt"
          test -s tests/data/BidiTest.txt
          test -s tests/data/BidiCharacterTest.txt
          wc -c data/ucd/DerivedBidiClass.txt tests/data/BidiTest.txt tests/data/BidiCharacterTest.txt
      - name: Run upstream Bidi conformance tests against Unicode 18.0.0
        run: cargo test --manifest-path /tmp/unicode-bidi/Cargo.toml -- --nocapture
      - name: Build pinned UTF-16 Bidi wrapper for wasm32
        run: |
          mkdir -p /tmp/unicode-bidi/bidi-runtime-poc-wrapper
          cp tools/bidi-runtime-poc/wasm/Cargo.toml /tmp/unicode-bidi/bidi-runtime-poc-wrapper/Cargo.toml
          mkdir -p /tmp/unicode-bidi/bidi-runtime-poc-wrapper/src
          cp tools/bidi-runtime-poc/wasm/src/lib.rs /tmp/unicode-bidi/bidi-runtime-poc-wrapper/src/lib.rs
          cd /tmp/unicode-bidi
          RUSTFLAGS="-C link-arg=--export-memory" cargo build \
            --manifest-path bidi-runtime-poc-wrapper/Cargo.toml \
            --target-dir /tmp/unicode-bidi/target \
            --target wasm32-unknown-unknown --release
          WASM_FILE=/tmp/unicode-bidi/target/wasm32-unknown-unknown/release/red_bidi_runtime_poc.wasm
          test -s "$WASM_FILE"
          file "$WASM_FILE"
          cp "$WASM_FILE" "$GITHUB_WORKSPACE/tools/bidi-runtime-poc/bidi-runtime-poc.wasm"
      - name: Download SHA-locked Unicode 18 GraphemeBreakTest conformance data
        run: |
          TEST_FILE=/tmp/GraphemeBreakTest-18.0.0.txt
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://raw.githubusercontent.com/unicode-org/unicodetools/725fb6055cd42915c74bcf77b91aa8fb8ef18669/unicodetools/data/ucd/18.0.0/auxiliary/GraphemeBreakTest.txt' \
            --output "$TEST_FILE"
          test "$(head -n 1 "$TEST_FILE")" = "# GraphemeBreakTest-18.0.0.txt"
          test "$(git hash-object "$TEST_FILE")" = "75196cefa5ad20776d7737fc9f3a37c53c87c231"
          python3 tools/bidi-runtime-poc/prepare_grapheme_fixtures.py "$TEST_FILE" /tmp/unicode18-grapheme-fixtures.json
      - name: Install headless browser for classic Worker parity
        run: |
          npm install -g agent-browser@0.41.2
          agent-browser install --with-deps
      - name: Prove Node and classic Worker UTF-16 Bidi and GraphemeBreakTest parity
        run: node tools/bidi-runtime-poc/run.js tools/bidi-runtime-poc/bidi-runtime-poc.wasm /tmp/unicode18-grapheme-fixtures.json
      - name: Upload Unicode 18 Bidi runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidi-runtime-poc
          path: /tmp/bidi-runtime-poc-report.json
          if-no-files-found: ignore

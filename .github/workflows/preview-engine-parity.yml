# .github/workflows/preview-engine-parity.yml — פריסת preview מבודד לענף המנוע המאוחד
#
# **סעיף ד בהוראת 19.11 (מיילסטון legacy↔unified parity):** ענף
# engine/legacy-parity-preview-20261119 מקבל build מלא של האפליקציה — לא
# UI mock/debug bundle — המריץ את פרופיל unified בנתיב ה־UI/Worker האמיתי,
# בספריית משנה קבועה ב־gh-pages: previews/engine-parity/.
#
# כללים מחייבים:
#   1. לבקשת המשתמש, gh-pages root וגם previews/engine-parity/ מוגשים כעת
#      מה-build המלא של ענף הניסוי בפרופיל unified. זהו עדכון Pages ישיר בלבד:
#      אין merge ל-main, אין שינוי בקוד main, ואין מחיקת מנוע legacy מהמקור.
#   2. root מתעד ב-build-info.json את source branch/commit ומסומן כסביבת ניסוי.
#      תיקון נוסף ל-main אינו מתבצע כאן; זהו נתיב צפייה בגרסה המאוחדת בלבד.
#   3. שומרים על .nojekyll, assets קיימים, קובצי gh-pages אחרים ועל previews/.
#      זהו GitHub Project Pages (אין CNAME). rsync לשורש לעולם אינו משתמש ב---delete.
#   4. assets/fonts הקיימים נשארים במקומם; תוכן ui מעודכן מועתק אליהם.
#   5. אין secrets; הרשאות מינימליות (contents:write ל־push ל־gh-pages בלבד).
#   6. אין לבצע merge אוטומטי של ענף העבודה ל-main בעקבות פריסה מוצלחת.
name: preview-engine-parity

on:
  push:
    branches: [ engine/legacy-parity-preview-20261119 ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-engine-parity
  cancel-in-progress: false

jobs:
  build-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout engine branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # הבדיקות עצמן רצות ב-ci.yml/corpus-invariants על push לענף זה.
      # כאן מוודאים רק שהבנדלים נבנים מהמקור ללא שגיאה — שער מקדים לפריסה.
      - name: Build browser bundles from source (real build, no mocks)
        run: |
          node --version
          node tools/build-worker-bundle.js
          test -s red-build/ui/app.bundle.js
          test -s red-build/ui/engine-worker.bundle.js

      - name: 'Sanity: bundles carry the unified-only engine (2ae45b9+)'
        run: |
          # מנוע יחיד (2ae45b9): דגל ה-dispatch _engine-force-unified הוסר עם
          # הסרת legacy. השער החדש: (א) ה-Worker נושא את נתיב ה-PageModel;
          # (ב) ה-Worker אינו נושא את מנוע המורשת או את המקרן/הרנדרר שלו
          # (בקרת שלילה — אפס קריאות legacy בבנדל); (ג) האפליקציה נושאת את
          # מסלול שחזור ה-PageModel.
          grep -q 'pageModel' red-build/ui/app.bundle.js \
            || { echo 'FATAL: app bundle lacks the PageModel restore path'; exit 1; }
          grep -q 'pageModel' red-build/ui/engine-worker.bundle.js \
            || { echo 'FATAL: worker bundle lacks PageModel output'; exit 1; }
          if grep -q 'legacyTypeset(\|renderLegacyPage(\|projectLegacyDocument(' red-build/ui/engine-worker.bundle.js; then
            echo 'FATAL: worker bundle still contains a legacy engine call path'; exit 1
          fi
          # הערה: מזהי impact-path ישנים ('layout/legacy-imud-flow') בקטלוג
          # ההגדרות והערות תיעוד אינם קריאת מנוע — הבנייה עצמה מוכיחה שאין
          # require תלוי; הם מטופלים בניקוי הקטלוג (שלב הגדרות/Text IDs).

      - name: Write build-info.json (commit + timestamp + profile)
        run: |
          printf '%s' '{"profile":"unified","branch":"engine/legacy-parity-preview-20261119","commit":"${{ github.sha }}","builtAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","note":"סביבת ניסוי — אינה אישור לנכונות המנוע או לאישור cutover"}' > red-build/ui/build-info.json
          cat red-build/ui/build-info.json

      - name: Checkout gh-pages (preserving production root)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Verify Pages root and shared assets before staging
        run: |
          test -f gh-pages-checkout/index.html || { echo 'FATAL: gh-pages root index.html missing'; exit 1; }
          test -d gh-pages-checkout/assets || { echo 'FATAL: gh-pages root assets/ missing'; exit 1; }
          test -d gh-pages-checkout/assets/imud/fonts || { echo 'FATAL: shared fonts missing'; exit 1; }
          test -f gh-pages-checkout/.nojekyll || { echo 'FATAL: .nojekyll missing'; exit 1; }
          N_FONTS=$(ls gh-pages-checkout/assets/imud/fonts | wc -l)
          test "$N_FONTS" -gt 1000 || { echo "FATAL: shared font catalog incomplete ($N_FONTS)"; exit 1; }

      - name: Stage full app into preview and Pages root (no source-branch merge)
        run: |
          mkdir -p gh-pages-checkout/previews/engine-parity
          # Preview קבוע: build מלא ומבודד.
          rsync -a --delete red-build/ui/ gh-pages-checkout/previews/engine-parity/
          # Pages root: בקשת המשתמש להציג את Unified בלי למזג ל-main.
          # אין --delete: CNAME, assets משותפים, previews וקבצים אחרים נשמרים.
          rsync -a --exclude='_export_test.html' --exclude='_fx.txt' --exclude='_vl.txt' red-build/ui/ gh-pages-checkout/
          # root + preview מקבלים provenance מפורש של אותו build.
          printf '%s' '{"profile":"unified","branch":"engine/legacy-parity-preview-20261119","commit":"${{ github.sha }}","builtAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","mode":"direct-gh-pages-deploy-no-main-merge","note":"סביבת ניסוי — קוד main ומנוע legacy נשארו ללא שינוי"}' > gh-pages-checkout/build-info.json
          printf '%s' '{"sourceBranch":"engine/legacy-parity-preview-20261119","commit":"${{ github.sha }}","builtAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","profile":"unified","label":"סביבת ניסוי — אינה אישור לנכונות המנוע או לאישור cutover"}' > gh-pages-checkout/previews/engine-parity/preview-info.json
          rm -f gh-pages-checkout/previews/engine-parity/_export_test.html gh-pages-checkout/previews/engine-parity/_fx.txt gh-pages-checkout/previews/engine-parity/_vl.txt || true

      - name: Verify root and subpath run the same unified build
        run: |
          P=gh-pages-checkout/previews/engine-parity
          for D in gh-pages-checkout "$P"; do
            for f in index.html styles.css app.bundle.js engine-worker.bundle.js build-info.json favicon.ico imudify-icon.svg assets/imud/default_settings.json; do
              test -f "$D/$f" || { echo "FATAL: missing $D/$f"; exit 1; }
            done
            test -d "$D/assets/imud/fonts" || { echo "FATAL: fonts dir missing in $D"; exit 1; }
            N_FONTS=$(ls "$D/assets/imud/fonts" | wc -l)
            test "$N_FONTS" -gt 1000 || { echo "FATAL: font catalog incomplete in $D ($N_FONTS)"; exit 1; }
            # The pinned shaping runtime is loaded relative to the Worker URL.
            # Verify every JS/WASM/metadata file at both deployment roots.
            for f in \
              manifest.json README.md \
              harfbuzzjs/package.json harfbuzzjs/LICENSE \
              harfbuzzjs/dist/index.mjs harfbuzzjs/dist/harfbuzz.js harfbuzzjs/dist/harfbuzz.wasm \
              unicode18-bidi-runtime.js unicode18-bidi-runtime.wasm; do
              test -s "$D/assets/shaping-runtime/$f" || {
                echo "FATAL: missing shaping runtime asset $D/assets/shaping-runtime/$f"
                exit 1
              }
            done
            grep -q '"profile":"unified"' "$D/build-info.json" || { echo "FATAL: $D is not marked unified"; exit 1; }
          done
          cmp -s gh-pages-checkout/app.bundle.js "$P/app.bundle.js" || { echo 'FATAL: root and preview app bundles differ'; exit 1; }
          cmp -s gh-pages-checkout/engine-worker.bundle.js "$P/engine-worker.bundle.js" || { echo 'FATAL: root and preview Worker bundles differ'; exit 1; }
          for f in \
            manifest.json README.md \
            harfbuzzjs/package.json harfbuzzjs/LICENSE \
            harfbuzzjs/dist/index.mjs harfbuzzjs/dist/harfbuzz.js harfbuzzjs/dist/harfbuzz.wasm \
            unicode18-bidi-runtime.js unicode18-bidi-runtime.wasm; do
            cmp -s "gh-pages-checkout/assets/shaping-runtime/$f" "$P/assets/shaping-runtime/$f" || {
              echo "FATAL: root and preview shaping runtime asset differs: $f"
              exit 1
            }
          done
          test -f gh-pages-checkout/.nojekyll || { echo 'FATAL: .nojekyll was lost'; exit 1; }
          echo "root size: $(du -sh gh-pages-checkout | cut -f1)"
          echo "preview size: $(du -sh $P | cut -f1)"

      - name: Commit staged preview to gh-pages
        run: |
          cd gh-pages-checkout
          git config user.name "github-actions[preview-engine-parity]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to stage — preview identical"
          else
            git commit -m "preview(engine-parity): ${{ github.sha }} — unified experimental from engine/legacy-parity-preview-20261119"
            git push origin gh-pages
          fi

      - name: Summary
        run: |
          cat <<'EOF'
          Unified app staged to both Pages root and previews/engine-parity/ from ${{ github.sha }}.
          No merge or push to main was performed; main retains the legacy engine source.
          Root URL: https://suginach.github.io/Tora_Book_Typesetter_Red_Work_2/
          Preview URL: https://suginach.github.io/Tora_Book_Typesetter_Red_Work_2/previews/engine-parity/
          Both URLs must be verified in a browser with an actual typeset request, Worker, fonts and PDF export.
          The Pages deployment is an experimental presentation of Unified, not a declaration that all parity audits passed.
          EOF

  # Run the public-site acceptance only after this exact commit has been built
  # and staged to gh-pages. This removes the race between parallel push workflows.
  live-audit:
    needs: build-and-stage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the exact deployed source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Pages HTTP to serve this exact commit
        run: |
          EXPECTED_SHA=$(git rev-parse HEAD)
          BUILD_INFO_URL='https://suginach.github.io/Tora_Book_Typesetter_Red_Work_2/build-info.json'
          ACTUAL_SHA=''
          for attempt in $(seq 1 180); do
            INFO=$(curl -fsSL -H 'Cache-Control: no-cache' "${BUILD_INFO_URL}?check=$(date +%s%N)" 2>/dev/null || true)
            ACTUAL_SHA=$(printf '%s' "$INFO" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).commit||"")}catch(e){console.log("")}})')
            if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
              echo "Pages serves expected commit $EXPECTED_SHA"
              exit 0
            fi
            echo "Waiting for Pages: expected=$EXPECTED_SHA actual=${ACTUAL_SHA:-unavailable} attempt=$attempt/180"
            sleep 5
          done
          echo "FATAL: Pages did not publish expected commit $EXPECTED_SHA (last actual: ${ACTUAL_SHA:-unavailable})"
          exit 1

      # Rebuild the expected browser artifacts from this exact source checkout.
      # The live audit compares the deployed HTTP bytes to this reproducible build,
      # never to main (Pages is intentionally sourced from the Unified work branch).
      - name: Build expected browser bundles from exact source commit
        run: |
          node tools/build-worker-bundle.js
          test -s red-build/ui/app.bundle.js
          test -s red-build/ui/engine-worker.bundle.js

      - name: Install agent-browser + headless browser
        run: |
          npm install -g agent-browser@0.41.2
          agent-browser install --with-deps

      - name: Install Poppler for exported PDF inspection
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Full math audit — exact public Pages build (DOM + HTML/PDF + impact signature)
        run: |
          node tools/layout-audit/run-full-math.js --tag live --url https://suginach.github.io/Tora_Book_Typesetter_Red_Work_2/ --fixture audits/very_long_test_text.txt --capture-exports

      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-math-audit-live
          path: red-build/tests/artifacts/full-math-audit/
          if-no-files-found: ignore

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarfBuzz classic-worker runtime proof</title>
</head>
<body>
  <pre id="result">RUNNING</pre>
  <script>
    (async function main() {
      const output = document.getElementById('result');
      window.__hbPoc = { state: 'running' };
      const finish = (value) => {
        window.__hbPoc = value;
        output.textContent = JSON.stringify(value, null, 2);
      };
      try {
        const expectedResponse = await fetch('/expected.json', { cache: 'no-store' });
        if (!expectedResponse.ok) throw new Error('could not fetch Node reference output');
        const expectedJson = await expectedResponse.text();
        const expected = JSON.parse(expectedJson);
        const worker = new Worker('/classic-worker.js', { name: 'harfbuzz-classic-worker-poc' });
        const timer = setTimeout(() => {
          worker.terminate();
          finish({ state: 'failed', error: 'classic Worker shaping timed out' });
        }, 90000);
        worker.onmessage = (event) => {
          clearTimeout(timer);
          worker.terminate();
          const data = event.data || {};
          if (!data.ok) {
            finish({ state: 'failed', error: data.error || 'worker shaping failed' });
            return;
          }
          const actualJson = JSON.stringify(data.results);
          const exactMatch = actualJson === expectedJson;
          finish({
            state: exactMatch && data.runtime && data.runtime.classicWorker && data.runtime.dynamicImport
              ? 'passed' : 'failed',
            classicWorker: data.runtime && data.runtime.classicWorker,
            dynamicImport: data.runtime && data.runtime.dynamicImport,
            wasmLoaded: data.runtime && data.runtime.wasmLoaded,
            harfBuzzVersion: data.results && data.results[0] && data.results[0].harfBuzzVersion,
            fontCount: data.results && data.results.length,
            caseCountPerFont: data.results && data.results[0] && data.results[0].cases.length,
            glyphCount: data.results ? data.results.reduce((sum, item) =>
              sum + item.cases.reduce((subtotal, testCase) => subtotal + testCase.glyphs.length, 0), 0) : 0,
            fonts: data.results ? data.results.map(item => ({
              name: item.fontName,
              format: item.fontFormat,
              upem: item.unitsPerEm,
              axes: item.axisInfos,
              outlineSweep: item.outlineSweep,
              variationMode: item.variationMode,
              coverageStatus: item.coverageStatus,
              missingBaseCodepoints: item.missingBaseCodepoints,
              missingMarkCodepoints: item.missingMarkCodepoints,
              notdefGlyphCount: item.notdefGlyphCount,
              missingCodepoints: item.missingCodepoints,
              glyphCount: item.cases.reduce((sum, testCase) => sum + testCase.glyphs.length, 0)
            })) : [],
            exactNodeParity: exactMatch
          });
        };
        worker.onerror = (event) => {
          clearTimeout(timer);
          worker.terminate();
          finish({ state: 'failed', error: event.message || 'classic Worker error' });
        };
        const fonts = expected.map(item => ({
          name: item.fontName,
          format: item.fontFormat,
          variationMode: item.variationMode,
          normalizedFrom: item.normalizedFrom,
          sourceOutlineFormat: item.sourceOutlineFormat,
          url: '/fonts/' + item.fontName
        }));
        worker.postMessage({
          type: 'shape',
          moduleUrl: new URL('/harfbuzzjs/dist/index.mjs', location.href).href,
          fonts
        });
      } catch (error) {
        finish({ state: 'failed', error: String(error && error.stack || error) });
      }
    })();
  </script>
</body>
</html>
